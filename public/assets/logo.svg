<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="cp-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="cp-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="cp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(20, 16)">
    <!-- Background subtle halo -->
    <circle cx="34" cy="34" r="30" fill="#ffffff" fill-opacity="0.04" />
    
    <!-- Outer interconnected block ring -->
    <rect x="10" y="10" width="48" height="48" rx="14" stroke="url(#cp-grad-primary)" stroke-width="3" fill="none" opacity="0.9" />
    
    <!-- Dynamic Chain Links / Flow -->
    <path d="M22 34 H36 M32 24 L42 34 L32 44" stroke="url(#cp-grad-primary)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="22" cy="34" r="4.5" fill="url(#cp-grad-accent)" filter="url(#cp-glow)" />
    <circle cx="44" cy="34" r="3" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <text x="96" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="34" letter-spacing="-0.04em" fill="#FFFFFF">
    Chain<tspan fill="#94A3B8" font-weight="400">Pay</tspan>
  </text>
  
  <!-- Subtle Badge / Subtitle -->
  <rect x="254" y="34" width="70" height="20" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
  <text x="289" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="9.5" letter-spacing="0.06em" fill="#E2E8F0" text-anchor="middle">
    EVM API
  </text>
</svg>
